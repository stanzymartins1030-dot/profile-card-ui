<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card design UI</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <h1>martins profile card</h1>
    <div class="container">
        <div class="card">
            <div class="top">
                <i class="bi bi-bookmark"></i>
            </div>
            <div class="middle">
                <div class="profile-details">
                    <div class="profile-img">
                        <img src="images/profile.jpg" alt="">
                    </div>
                    <h4>Aiwanfo Faith</h4>
                    <p>Design for clarity & usability</p>
                    <div class="skill-loc">
                        <div class="skill">
                            <i class="bi bi-cart-dash"></i>
                            <p>Product desiger</p>
                        </div>
                        <div class="skill">
                            <i class="bi bi-geo-alt"></i>
                            <p>In the feedback loop</p>
                        </div>
                    </div>
                </div>
                <div class="logo">
                    <div class="logos">
                        <i class="bi bi-claude"></i>
                        <i class="bi bi-git"></i>
                        <i class="bi bi-wordpress"></i>
                        <i class="bi bi-instagram"></i>
                    </div>
                    <div class="logo-title">
                        <h3>Tools</h3>
                    </div>
                </div>
            </div>
            <div class="bottom">
                <div class="stat">
                    <div class="stats" id="stat1">
                        <div class="star">
                            <i class="bi bi-star-fill"></i>
                            <p>4.6</p>
                        </div>
                        <p>rating</p>
                    </div>
                    <div class="stats" id="stat2">
                        <h3>7 days</h3>
                        <p>duration</p>
                    </div>
                    <div class="stats">
                        <h3>$44/hr</h3>
                        <p>rate</p>
                    </div>
                </div>

                <div class="btn">
                    <button>Get in touch</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
